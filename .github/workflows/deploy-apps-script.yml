name: Apps Script 자동 배포

# Code.gs가 main에 반영될 때마다 clasp로 Apps Script에 push하고
# 기존 웹 앱 배포(주소 고정)를 새 버전으로 갱신한다.
# 최초 1회 설정은 README.md의 "Apps Script 자동 배포 설정" 참고.
# 설정(Secrets)을 아직 안 했으면 실패로 끝나지 않고 건너뛴다 — 그동안은 수동 배포.

on:
  push:
    branches: [main]
    paths:
      - "Code.gs"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      READY: ${{ secrets.CLASPRC_JSON_B64 != '' && secrets.CLASP_JSON_B64 != '' && secrets.CLASP_DEPLOYMENT_ID != '' }}
    steps:
      - name: 설정 확인
        if: env.READY != 'true'
        run: echo "::notice::Apps Script 자동 배포 Secrets가 아직 없어서 건너뜁니다. Code.gs는 수동으로 배포해주세요 (README 1-1 참고)."

      - uses: actions/checkout@v4
        if: env.READY == 'true'

      - uses: actions/setup-node@v4
        if: env.READY == 'true'
        with:
          node-version: 20

      - if: env.READY == 'true'
        run: npm install -g @google/clasp

      - name: clasp 인증 정보 복원
        if: env.READY == 'true'
        run: echo "${{ secrets.CLASPRC_JSON_B64 }}" | base64 -d > "$HOME/.clasprc.json"

      - name: clasp 프로젝트 설정 복원
        if: env.READY == 'true'
        run: echo "${{ secrets.CLASP_JSON_B64 }}" | base64 -d > .clasp.json

      - name: Code.gs push
        if: env.READY == 'true'
        run: clasp push --force

      - name: 웹 앱 새 버전으로 재배포 (주소 유지)
        if: env.READY == 'true'
        run: clasp deploy --deploymentId "${{ secrets.CLASP_DEPLOYMENT_ID }}" --description "auto-deploy ${{ github.sha }}"
